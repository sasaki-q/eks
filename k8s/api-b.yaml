apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-b
  namespace: default
  labels:
    app: api-b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-b
  template:
    metadata:
      labels:
        app: api-b
    spec:
      containers:
        - name: api-b
          image: IMAGE_URI
          ports:
            - containerPort: 8080
          env:
            - name: SERVICE_NAME
              value: api-b
            - name: PORT
              value: "8080"
            - name: INTERACTED_POD_URI
              value: http://api-a-svc
            - name: PATH_PREFIX
              value: api-b
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api-b-svc
  namespace: default
  labels:
    app: api-b
spec:
  type: ClusterIP
  selector:
    app: api-b
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
